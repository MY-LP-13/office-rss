<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gratitude Board | LeavePlus</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #00693a;
    --green: #007943;
    --lime: #a6cc38;
    --verdigris: #37816c;
    --ink: #12281D;
    --ink-soft: #3D5A4B;
    --muted: #5E6E64;
    --card: #FFFFFF;
    --page: #F2F6F1;
    --line: #DCE6DD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: var(--page);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  .top {
    background: linear-gradient(160deg, var(--green-deep) 0%, var(--green) 100%);
    color: #fff;
    padding: 28px 20px 30px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand img { height: 30px; width: auto; display: block; }
  .title { margin-top: 22px; font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
  .sub { margin-top: 8px; font-size: 17px; color: rgba(255,255,255,0.92); max-width: 640px; }
  .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 0 22px; border-radius: 999px;
    background: #fff; color: var(--green-deep);
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .btn:hover { background: #EEF6E3; }
  .btn:focus-visible, .search input:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
  .count { font-size: 15px; color: rgba(255,255,255,0.92); }

  /* Toolbar */
  .bar { padding: 18px 20px 4px; }
  .search { position: relative; max-width: 420px; }
  .search label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .search input {
    width: 100%; min-height: 46px; padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid #B9C9BD; border-radius: 10px;
  }

  /* Wall */
  main { padding: 14px 20px 48px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; align-items: start; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px 16px; position: relative; overflow: hidden;
  }
  .card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--accent, var(--green)); }
  .card.member { --accent: var(--lime); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 4px; }
  .for { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--green-deep); overflow-wrap: anywhere; }
  .when { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .when.new { color: var(--green-deep); font-weight: 700; }
  .msg { margin-top: 10px; font-size: 17px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .msg::before { content: '\201C'; color: var(--lime); font-weight: 800; margin-right: 1px; }
  .msg::after { content: '\201D'; }
  .from { margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--ink-soft); }
  .from span { font-weight: 400; color: var(--muted); }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
    background: #EEF6E3; color: #4A5E14; font-size: 12px; font-weight: 600; vertical-align: 1px;
  }

  .state { text-align: center; padding: 48px 20px; color: var(--ink-soft); font-size: 17px; }
  .state strong { display: block; font-size: 22px; color: var(--ink); margin-bottom: 6px; }
  .note { font-size: 14px; color: var(--muted); margin-top: 18px; text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: in 0.4s ease both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>

    <h1 class="title">Gratitude Board</h1>
    <p class="sub">Thank-yous from around LeavePlus, newest first. The same messages you see on the office screens.</p>
    <div class="actions">
      <a class="btn" href="https://forms.cloud.microsoft/r/JN1eqV8m4T" target="_blank" rel="noopener">Add a thank-you</a>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <label for="q">Find a name or a word</label>
      <input id="q" type="search" autocomplete="off" placeholder="e.g. Doreen, stapler">
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <h2 class="sr">Thank-yous</h2>
    <div class="wall" id="wall" aria-live="polite"></div>
    <div class="state" id="state" hidden></div>
    <p class="note">Shared by the LeavePlus Wellness Committee. Every message is checked before it appears.</p>
  </div>
</main>

<script>
(function () {
  'use strict';

  var FEED_URL   = 'https://raw.githubusercontent.com/MY-LP-13/office-rss/main/gratitude-feed.xml';
  var REFRESH_MS = 3 * 60 * 1000;
  var NEW_HOURS  = 24;

  var items = [];
  var wall = document.getElementById('wall');
  var state = document.getElementById('state');
  var q = document.getElementById('q');

  function text(node, tag) {
    var el = node.getElementsByTagName(tag)[0];
    return el && el.textContent ? el.textContent.trim() : '';
  }

  // Same parsing as the TV board, including the older "From X — grateful for Y" titles.
  function parseItem(node) {
    var title = text(node, 'title');
    var forWhat = text(node, 'category');
    var msg = text(node, 'description');
    if (!forWhat) {
      var m = title.match(/^\s*From\s+(.+?)\s+[—-]\s+grateful for\s+(.+)$/i);
      if (m) { title = m[1]; forWhat = m[2]; }
      else { title = title.replace(/^\s*From\s+/i, ''); }
    }
    return { name: title || 'A colleague', forWhat: forWhat, msg: msg, date: new Date(text(node, 'pubDate')) };
  }

  function whenLabel(d) {
    if (!d || isNaN(d.getTime())) return '';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var then = new Date(d.getTime()); then.setHours(0, 0, 0, 0);
    var days = Math.round((today - then) / 86400000);
    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7) return d.toLocaleDateString('en-AU', { weekday: 'long' });
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  }

  function isNew(d) {
    return d && !isNaN(d.getTime()) && (Date.now() - d.getTime()) < NEW_HOURS * 3600000;
  }

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;   // text only: feed content is never parsed as HTML
    return e;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var list = items.filter(function (it) {
      if (!term) return true;
      return (it.name + ' ' + it.forWhat + ' ' + it.msg).toLowerCase().indexOf(term) !== -1;
    });

    wall.textContent = '';
    state.hidden = true;

    if (!items.length) {
      state.hidden = false;
      state.textContent = '';
      state.appendChild(el('strong', null, 'Who made your week better?'));
      state.appendChild(document.createTextNode('Be the first to add a thank-you.'));
      return;
    }
    if (!list.length) {
      state.hidden = false;
      state.textContent = 'Nothing on the board matches “' + q.value.trim() + '”.';
      return;
    }

    list.forEach(function (it) {
      var member = /grateful member/i.test(it.name);
      var card = el('article', 'card' + (member ? ' member' : ''));
      var top = el('div', 'card-top');
      top.appendChild(el('div', 'for', it.forWhat || 'Thank you'));
      top.appendChild(el('div', 'when' + (isNew(it.date) ? ' new' : ''), isNew(it.date) ? 'New · ' + whenLabel(it.date) : whenLabel(it.date)));
      card.appendChild(top);
      card.appendChild(el('p', 'msg', it.msg || it.forWhat));
      var from = el('p', 'from');
      from.appendChild(el('span', null, 'from '));
      from.appendChild(document.createTextNode(it.name));
      if (member) from.appendChild(el('span', 'tag', 'Member'));
      card.appendChild(from);
      wall.appendChild(card);
    });
  }

  function updateCount() {
    var n = items.filter(function (it) { return !/wellness committee/i.test(it.name); }).length;
    document.getElementById('count').textContent = n ? n + ' thank-yous on the board right now' : '';
  }

  function load() {
    // A fresh query string each few minutes skips GitHub's 5-minute cache.
    var bust = Math.floor(Date.now() / 60000);
    fetch(FEED_URL + '?t=' + bust, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (xml) {
        var doc = new DOMParser().parseFromString(xml, 'text/xml');
        if (doc.getElementsByTagName('parsererror').length) throw new Error('bad feed');
        var nodes = doc.getElementsByTagName('item');
        var next = [];
        for (var i = 0; i < nodes.length; i++) next.push(parseItem(nodes[i]));
        next.sort(function (a, b) { return (b.date.getTime() || 0) - (a.date.getTime() || 0); });
        items = next;
        updateCount();
        render();
      })
      .catch(function () {
        // Keep whatever is already showing. Only say something if there's nothing to show.
        if (!items.length) {
          state.hidden = false;
          state.textContent = '';
          state.appendChild(el('strong', null, 'The board is having a breather'));
          state.appendChild(document.createTextNode('Try again in a minute, or check the screens in the office.'));
        }
      });
  }

  q.addEventListener('input', render);
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
