name: Update Gratitude Feed

on:
  repository_dispatch:
    types: [new-gratitude]

permissions:
  contents: write

# Two approvals landing at once would otherwise race each other on push.
concurrency:
  group: gratitude-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add entry to feed
        # The submission is passed as environment variables, never spliced
        # into the script body. Text from the form is data, not code.
        env:
          GB_NAME: ${{ github.event.client_payload.name }}
          GB_GRATEFUL_FOR: ${{ github.event.client_payload.grateful_for }}
          GB_MESSAGE: ${{ github.event.client_payload.message }}
          GB_DATE: ${{ github.event.client_payload.date }}
        run: python3 scripts/add_gratitude.py

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- gratitude-feed.xml; then
            echo "Feed unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gratitude-feed.xml
          git commit -m "New gratitude entry"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed. Retrying."
            sleep 5
          done
          echo "::error::Could not push the updated feed after 3 attempts."
          exit 1
